name: AgentBooth
options:
  deploymentTarget:
    macOS: "14.0"
  knownRegions:
    - en
    - ja
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    version: 2.9.1
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  AgentBooth:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Configurations/DevelopmentTeam.xcconfig
      Release: Configurations/DevelopmentTeam.xcconfig
    sources:
      - path: AgentBooth
        excludes:
          - agentbooth.icon
      - path: AgentBooth/agentbooth.icon
        buildPhase: resources
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - package: Sparkle
        product: Sparkle
    info:
      path: AgentBooth/Info.plist
      properties:
        CFBundleDisplayName: AgentBooth
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.music
        NSAppleEventsUsageDescription: AgentBooth needs automation access to Music.app to control playlist playback.
        NSScreenCaptureUsageDescription: AgentBooth needs System Audio Capture permission to record radio programs.
        SUFeedURL: https://products.desireforwealth.com/appcast/agentbooth/appcast.xml
        SUPublicEDKey: AjyX0n1pRegRGzzE3P8OcIWoretFg4UPxUqFPJTfS6M=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmng.AgentBooth
        PRODUCT_NAME: AgentBooth
        ASSETCATALOG_COMPILER_APPICON_NAME: agentbooth
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "16"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: AgentBooth/AgentBooth.entitlements
  AgentBoothTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    configFiles:
      Debug: Configurations/DevelopmentTeam.xcconfig
      Release: Configurations/DevelopmentTeam.xcconfig
    sources:
      - path: AgentBoothTests
    dependencies:
      - target: AgentBooth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dmng.AgentBoothTests
        GENERATE_INFOPLIST_FILE: YES
